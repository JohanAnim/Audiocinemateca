name: "Publish Release from Local Build"

on:
  push:
    tags:
      - 'v*'
      - '[0-9]*'
      - '*.*.*'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: "Checkout del código"
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: "Instalar Cutver CLI"
        uses: cutver/setup@v1

      - name: "Detectar canal (Estable vs Beta/Pre-release)"
        id: release_meta
        shell: bash
        run: |
          TAG="${{ github.ref_name }}"
          if [[ "$TAG" == *-* ]]; then
            echo "is_prerelease=true" >> "$GITHUB_OUTPUT"
            echo "channel_label=Beta" >> "$GITHUB_OUTPUT"
          else
            echo "is_prerelease=false" >> "$GITHUB_OUTPUT"
            echo "channel_label=Estable" >> "$GITHUB_OUTPUT"
          fi

      - name: "Extraer notas de la versión con Cutver"
        shell: bash
        run: |
          TAG="${{ github.ref_name }}"
          if cutver changelog show "$TAG" --include-header > release-notes.md 2>/dev/null && [ -s release-notes.md ]; then
            echo "Notas extraídas correctamente con cutver para $TAG"
          elif [ -f CHANGELOG.md ]; then
            cp CHANGELOG.md release-notes.md
            echo "Usando CHANGELOG.md como respaldo para $TAG"
          elif [ -f changelog.md ]; then
            cp changelog.md release-notes.md
          else
            echo "Notas de la versión $TAG" > release-notes.md
          fi

      - name: "Buscar APK local"
        id: find_apk
        run: |
          APK_FILE=$(find app/release/ -name "*.apk" | head -n 1)
          if [ -z "$APK_FILE" ]; then
            echo "Error: No se encontró ningún archivo APK en app/release/"
            exit 1
          fi
          echo "apk_path=$APK_FILE" >> $GITHUB_OUTPUT
          echo "Se encontró el APK: $APK_FILE"

      - name: "Crear GitHub Release"
        uses: softprops/action-gh-release@v2
        with:
          name: "Audiocinemateca (${{ steps.release_meta.outputs.channel_label }}): ${{ github.ref_name }}"
          body_path: release-notes.md
          files: ${{ steps.find_apk.outputs.apk_path }}
          draft: false
          prerelease: ${{ steps.release_meta.outputs.is_prerelease }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
