name: "Publish Release from Local Build"

on:
  push:
    tags:
      - 'v*'
      - '[0-9]*'
      - '*.*.*'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: "Checkout del código"
        uses: actions/checkout@v4

      - name: "Buscar APK local"
        id: find_apk
        run: |
          # Buscamos cualquier archivo .apk en app/release/
          APK_FILE=$(find app/release/ -name "*.apk" | head -n 1)
          if [ -z "$APK_FILE" ]; then
            echo "Error: No se encontró ningún archivo APK en app/release/"
            exit 1
          fi
          echo "apk_path=$APK_FILE" >> $GITHUB_OUTPUT
          echo "Se encontró el APK: $APK_FILE"

      - name: "Crear GitHub Release"
        uses: softprops/action-gh-release@v2
        with:
          name: "Nueva versión disponible de la Audiocinemateca: ${{ github.ref_name }}"
          body_path: changelog.md
          files: ${{ steps.find_apk.outputs.apk_path }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
